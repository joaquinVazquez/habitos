<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Racha — construye hábitos y no rompas tu racha de días consecutivos.">
  <meta name="theme-color" content="#063832">
